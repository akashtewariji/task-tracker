<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>To-Do List</h1>
      <div class="pending-counter" id="pendingCounter">Pending: 0</div>
    </div>

    <div class="input-container">
      <div class="task-input-row">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <div class="priority-selector">
          <button type="button" class="priority-btn priority-high active" data-priority="high" title="High Priority">🔴</button>
          <button type="button" class="priority-btn priority-medium" data-priority="medium" title="Medium Priority">🟡</button>
          <button type="button" class="priority-btn priority-low" data-priority="low" title="Low Priority">🟢</button>
        </div>
      </div>
      <div class="datetime-wrapper">
        <div class="date-time-inputs">
          <div class="date-input-wrapper">
            <input type="text" id="deadlineDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" maxlength="10">
            <input type="date" id="deadlineDatePicker" style="display: none;">
            <button type="button" class="calendar-btn" id="calendarBtn" title="Select date">📅</button>
          </div>
          <input type="time" id="deadlineTime">
        </div>
        <span class="checkmark" id="dateCheckmark" style="display: none;">✓</span>
        <div class="date-display" id="dateDisplay" style="display: none;"></div>
      </div>
      <div class="action-buttons">
        <button id="addTaskBtn">Add Task</button>
        <button id="historyBtn">History</button>
        <div class="priority-filter">
          <button class="filter-btn filter-white active" data-filter="all" title="All Priorities">⚪</button>
          <button class="filter-btn filter-red" data-filter="high" title="High Priority">🔴</button>
          <button class="filter-btn filter-yellow" data-filter="medium" title="Medium Priority">🟡</button>
          <button class="filter-btn filter-green" data-filter="low" title="Low Priority">🟢</button>
        </div>
      </div>
    </div>

    <ul id="taskList"></ul>
    <ul id="historyList" style="display: none;"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
